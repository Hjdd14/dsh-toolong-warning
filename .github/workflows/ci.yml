name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} — tests and hygiene
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The plugin resolves `@deepseek-ai/schemastery` from a running profile at
        # runtime; these suites deliberately run without one, exercising the
        # documented fallback descriptor too.
        node: ["22", "24"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install step on purpose: the plugin has no build step, and its only
      # runtime dependency resolves from the host harness, not from this
      # repository. The suites use Node built-ins only.
      - name: Detection, history, routes and bundle suites
        run: npm test

      - name: Repository privacy gate
        run: npm run check:hygiene
